version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: fe_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: login
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fe_backend
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: login
      DB_PORT: 3307
      JWT_SECRET: dev_secret
      CORS_ORIGIN: "*"
    depends_on:
      - db
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    container_name: fe_nginx
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./luucodecap1:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  db_data:
